<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenChat - Login</title>
    <!-- Google Fonts: Inter & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css?v=1.2">
    <link rel="stylesheet" href="css/login.css?v=1.2">
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="login-container">
        <header class="header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 8px;">
                    <ellipse cx="12" cy="13" rx="2.5" ry="4.5" fill="var(--spidey-red)" stroke="var(--spidey-red)"/>
                    <circle cx="12" cy="7" r="1.8" fill="var(--spidey-red)" stroke="var(--spidey-red)"/>
                    <path d="M9.5 10C7.5 9 6 7 6 5M14.5 10C16.5 9 18 7 18 5M9 13C6.5 13 5.5 12.5 4.5 11M15 13C17.5 13 18.5 12.5 19.5 11M9.5 16C7.5 17 6 19 6 21M14.5 16C16.5 17 18 19 18 21" stroke="var(--spidey-red)" stroke-linecap="round"/>
                </svg>
                <span>OpenChat</span>
            </div>
            <div class="mode-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                Secure Auth
            </div>
        </header>

        <div class="login-card">
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <h1>Welcome to OpenChat</h1>
                <p class="text-muted">A premium real-time messaging space. Sign in with Google to enter public chat rooms.</p>
            </div>

            <button id="btn-google-login" class="btn-google">
                <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <footer class="footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            OpenChat is a public chat platform. Please follow community rules.
        </footer>
    </div>

    <!-- Firebase Compat SDKs from CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script src="js/common.js?v=1.2"></script>
    <script src="js/auth.js?v=1.2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('in login view DOMContentLoaded event - Bootstrapping login state...');
            try {
                await window.appAuth.initializeFirebase();
            } catch (err) {
                console.error('Error during initial Firebase setup', err);
                window.appUtils.showToast('Failed to initialize connection to server', 'error');
            }

            // Observe auth state, if already authenticated, redirect to chat.html
            window.appAuth.observeAuthState((user) => {
                if (user) {
                    console.log('in login view observeAuthState - User is authenticated. Redirecting to chat.html...');
                    window.location.href = 'chat.html';
                }
            });

            // Bind sign-in button
            const loginBtn = document.getElementById('btn-google-login');
            if (loginBtn) {
                loginBtn.addEventListener('click', async () => {
                    console.log('in login view btnGoogleClick - Triggering Google Sign-In popup flow...');
                    window.appUtils.showLoader();
                    try {
                        await window.appAuth.loginWithGoogle();
                    } catch (error) {
                        console.error('in login view btnGoogleClick - Sign-In failed:', error);
                        window.appUtils.showToast('Google Sign-In failed. Please try again.', 'error');
                    } finally {
                        window.appUtils.hideLoader();
                    }
                });
            }
        });
    </script>
</body>
</html>
